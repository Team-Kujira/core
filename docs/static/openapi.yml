swagger: '2.0'
info:
  title: Cosmos SDK - gRPC Gateway docs
  description: A REST interface for state queries.
  version: 1.0.0
paths:
  '/cw-ica/interchain_account/owner/{owner}/connection/{connection_id}':
    get:
      summary: >-
        QueryInterchainAccount returns the interchain account for given owner
        address on a given connection pair
      operationId: InterchainAccount
      responses:
        '200':
          description: A successful response.
          schema:
            type: object
            properties:
              interchain_account_address:
                type: string
            title: >-
              QueryInterchainAccountResponse the response type for the
              Query/InterchainAccountAddress RPC
        default:
          description: An unexpected error response.
          schema:
            type: object
            properties:
              error:
                type: string
              code:
                type: integer
                format: int32
              message:
                type: string
              details:
                type: array
                items:
                  type: object
                  properties:
                    type_url:
                      type: string
                    value:
                      type: string
                      format: byte
      parameters:
        - name: owner
          in: path
          required: true
          type: string
        - name: connection_id
          in: path
          required: true
          type: string
        - name: account_id
          in: query
          required: false
          type: string
      tags:
        - Query
  '/kujira/denoms/by_creator/{creator}':
    get:
      operationId: DenomsFromCreator
      responses:
        '200':
          description: A successful response.
          schema:
            type: object
            properties:
              denoms:
                type: array
                items:
                  type: string
        default:
          description: An unexpected error response.
          schema:
            type: object
            properties:
              error:
                type: string
              code:
                type: integer
                format: int32
              message:
                type: string
              details:
                type: array
                items:
                  type: object
                  properties:
                    type_url:
                      type: string
                    value:
                      type: string
                      format: byte
      parameters:
        - name: creator
          in: path
          required: true
          type: string
      tags:
        - Query
  /kujira/denoms/params:
    get:
      summary: Params returns the total set of minting parameters.
      operationId: DenomParams
      responses:
        '200':
          description: A successful response.
          schema:
            type: object
            properties:
              params:
                description: params defines the parameters of the module.
                type: object
                properties:
                  creation_fee:
                    type: array
                    items:
                      type: object
                      properties:
                        denom:
                          type: string
                        amount:
                          type: string
                      description: >-
                        Coin defines a token with a denomination and an amount.


                        NOTE: The amount field is an Int which implements the
                        custom method

                        signatures required by gogoproto.
                title: Params holds parameters for the denom module
            description: >-
              QueryParamsResponse is the response type for the Query/Params RPC
              method.
        default:
          description: An unexpected error response.
          schema:
            type: object
            properties:
              error:
                type: string
              code:
                type: integer
                format: int32
              message:
                type: string
              details:
                type: array
                items:
                  type: object
                  properties:
                    type_url:
                      type: string
                    value:
                      type: string
                      format: byte
      tags:
        - Query
  '/kujira/denoms/{denom}/authority_metadata':
    get:
      operationId: DenomAuthorityMetadata
      responses:
        '200':
          description: A successful response.
          schema:
            type: object
            properties:
              authority_metadata:
                type: object
                properties:
                  Admin:
                    type: string
                    title: 'Can be empty for no admin, or a valid kujira address'
                description: >-
                  DenomAuthorityMetadata specifies metadata for addresses that
                  have specific

                  capabilities over a token factory denom. Right now there is
                  only one Admin

                  permission, but is planned to be extended to the future.
        default:
          description: An unexpected error response.
          schema:
            type: object
            properties:
              error:
                type: string
              code:
                type: integer
                format: int32
              message:
                type: string
              details:
                type: array
                items:
                  type: object
                  properties:
                    type_url:
                      type: string
                    value:
                      type: string
                      format: byte
      parameters:
        - name: denom
          in: path
          required: true
          type: string
      tags:
        - Query
  /oracle/params:
    get:
      summary: Params queries all parameters.
      operationId: OracleParams
      responses:
        '200':
          description: A successful response.
          schema:
            type: object
            properties:
              params:
                description: params defines the parameters of the module.
                type: object
                properties:
                  vote_period:
                    type: string
                    format: uint64
                  vote_threshold:
                    type: string
                  max_deviation:
                    type: string
                  required_symbols:
                    type: array
                    items:
                      type: object
                      properties:
                        symbol:
                          type: string
                        id:
                          type: integer
                          format: int64
                      title: >-
                        Symbol - the object to hold configurations of each
                        symbol
                  last_symbol_id:
                    type: integer
                    format: int64
                  slash_fraction:
                    type: string
                  slash_window:
                    type: string
                    format: uint64
                  min_valid_per_window:
                    type: string
            description: >-
              QueryParamsResponse is the response type for the Query/Params RPC
              method.
        default:
          description: An unexpected error response.
          schema:
            type: object
            properties:
              error:
                type: string
              code:
                type: integer
                format: int32
              message:
                type: string
              details:
                type: array
                items:
                  type: object
                  properties:
                    type_url:
                      type: string
                    value:
                      type: string
                      format: byte
      tags:
        - Query
  /oracle/symbols/actives:
    get:
      summary: Actives returns all active symbols
      operationId: Actives
      responses:
        '200':
          description: A successful response.
          schema:
            type: object
            properties:
              actives:
                type: array
                items:
                  type: string
                description: >-
                  actives defines a list of the symbols which oracle prices
                  aggreed upon.
            description: |-
              QueryActivesResponse is response type for the
              Query/Actives RPC method.
        default:
          description: An unexpected error response.
          schema:
            type: object
            properties:
              error:
                type: string
              code:
                type: integer
                format: int32
              message:
                type: string
              details:
                type: array
                items:
                  type: object
                  properties:
                    type_url:
                      type: string
                    value:
                      type: string
                      format: byte
      tags:
        - Query
  /oracle/symbols/exchange_rates:
    get:
      summary: ExchangeRates returns exchange rates of all symbols
      operationId: ExchangeRates
      responses:
        '200':
          description: A successful response.
          schema:
            type: object
            properties:
              exchange_rates:
                type: array
                items:
                  type: object
                  properties:
                    denom:
                      type: string
                    amount:
                      type: string
                  description: >-
                    DecCoin defines a token with a denomination and a decimal
                    amount.


                    NOTE: The amount field is an Dec which implements the custom
                    method

                    signatures required by gogoproto.
                description: >-
                  exchange_rates defines a list of the exchange rate for all
                  whitelisted symbols.
            description: |-
              QueryExchangeRatesResponse is response type for the
              Query/ExchangeRates RPC method.
        default:
          description: An unexpected error response.
          schema:
            type: object
            properties:
              error:
                type: string
              code:
                type: integer
                format: int32
              message:
                type: string
              details:
                type: array
                items:
                  type: object
                  properties:
                    type_url:
                      type: string
                    value:
                      type: string
                      format: byte
      tags:
        - Query
  '/oracle/symbols/{symbol}/exchange_rate':
    get:
      summary: ExchangeRate returns exchange rate of a symbol
      operationId: ExchangeRate
      responses:
        '200':
          description: A successful response.
          schema:
            type: object
            properties:
              exchange_rate:
                type: string
                title: exchange_rate defines the exchange rate of whitelisted assets
            description: |-
              QueryExchangeRateResponse is response type for the
              Query/ExchangeRate RPC method.
        default:
          description: An unexpected error response.
          schema:
            type: object
            properties:
              error:
                type: string
              code:
                type: integer
                format: int32
              message:
                type: string
              details:
                type: array
                items:
                  type: object
                  properties:
                    type_url:
                      type: string
                    value:
                      type: string
                      format: byte
      parameters:
        - name: symbol
          description: symbol defines the symbol to query for.
          in: path
          required: true
          type: string
      tags:
        - Query
  '/oracle/validators/{validator_addr}/miss':
    get:
      summary: MissCounter returns oracle miss counter of a validator
      operationId: MissCounter
      responses:
        '200':
          description: A successful response.
          schema:
            type: object
            properties:
              miss_counter:
                type: string
                format: uint64
                title: miss_counter defines the oracle miss counter of a validator
            description: |-
              QueryMissCounterResponse is response type for the
              Query/MissCounter RPC method.
        default:
          description: An unexpected error response.
          schema:
            type: object
            properties:
              error:
                type: string
              code:
                type: integer
                format: int32
              message:
                type: string
              details:
                type: array
                items:
                  type: object
                  properties:
                    type_url:
                      type: string
                    value:
                      type: string
                      format: byte
      parameters:
        - name: validator_addr
          description: validator defines the validator address to query for.
          in: path
          required: true
          type: string
      tags:
        - Query
  /kujira/scheduler/hook:
    get:
      summary: Queries a list of Hook items.
      operationId: HookAll
      responses:
        '200':
          description: A successful response.
          schema:
            type: object
            properties:
              Hook:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uint64
                    executor:
                      type: string
                    contract:
                      type: string
                    msg:
                      type: string
                      format: byte
                    frequency:
                      type: string
                      format: int64
                    funds:
                      type: array
                      items:
                        type: object
                        properties:
                          denom:
                            type: string
                          amount:
                            type: string
                        description: >-
                          Coin defines a token with a denomination and an
                          amount.


                          NOTE: The amount field is an Int which implements the
                          custom method

                          signatures required by gogoproto.
              pagination:
                type: object
                properties:
                  next_key:
                    type: string
                    format: byte
                    description: |-
                      next_key is the key to be passed to PageRequest.key to
                      query the next page most efficiently. It will be empty if
                      there are no more results.
                  total:
                    type: string
                    format: uint64
                    title: >-
                      total is total number of results available if
                      PageRequest.count_total

                      was set, its value is undefined otherwise
                description: >-
                  PageResponse is to be embedded in gRPC response messages where
                  the

                  corresponding request message has used PageRequest.

                   message SomeResponse {
                           repeated Bar results = 1;
                           PageResponse page = 2;
                   }
        default:
          description: An unexpected error response.
          schema:
            type: object
            properties:
              error:
                type: string
              code:
                type: integer
                format: int32
              message:
                type: string
              details:
                type: array
                items:
                  type: object
                  properties:
                    type_url:
                      type: string
                    value:
                      type: string
                      format: byte
      parameters:
        - name: pagination.key
          description: |-
            key is a value returned in PageResponse.next_key to begin
            querying the next page most efficiently. Only one of offset or key
            should be set.
          in: query
          required: false
          type: string
          format: byte
        - name: pagination.offset
          description: >-
            offset is a numeric offset that can be used when key is unavailable.

            It is less efficient than using key. Only one of offset or key
            should

            be set.
          in: query
          required: false
          type: string
          format: uint64
        - name: pagination.limit
          description: >-
            limit is the total number of results to be returned in the result
            page.

            If left empty it will default to a value to be set by each app.
          in: query
          required: false
          type: string
          format: uint64
        - name: pagination.count_total
          description: >-
            count_total is set to true  to indicate that the result set should
            include

            a count of the total number of items available for pagination in
            UIs.

            count_total is only respected when offset is used. It is ignored
            when key

            is set.
          in: query
          required: false
          type: boolean
        - name: pagination.reverse
          description: >-
            reverse is set to true if results are to be returned in the
            descending order.


            Since: cosmos-sdk 0.43
          in: query
          required: false
          type: boolean
      tags:
        - Query
  '/kujira/scheduler/hook/{id}':
    get:
      summary: Queries a Hook by id.
      operationId: Hook
      responses:
        '200':
          description: A successful response.
          schema:
            type: object
            properties:
              Hook:
                type: object
                properties:
                  id:
                    type: string
                    format: uint64
                  executor:
                    type: string
                  contract:
                    type: string
                  msg:
                    type: string
                    format: byte
                  frequency:
                    type: string
                    format: int64
                  funds:
                    type: array
                    items:
                      type: object
                      properties:
                        denom:
                          type: string
                        amount:
                          type: string
                      description: >-
                        Coin defines a token with a denomination and an amount.


                        NOTE: The amount field is an Int which implements the
                        custom method

                        signatures required by gogoproto.
        default:
          description: An unexpected error response.
          schema:
            type: object
            properties:
              error:
                type: string
              code:
                type: integer
                format: int32
              message:
                type: string
              details:
                type: array
                items:
                  type: object
                  properties:
                    type_url:
                      type: string
                    value:
                      type: string
                      format: byte
      parameters:
        - name: id
          in: path
          required: true
          type: string
          format: uint64
      tags:
        - Query
  /kujira/scheduler/params:
    get:
      summary: Parameters queries the parameters of the module.
      operationId: SchedulerParams
      responses:
        '200':
          description: A successful response.
          schema:
            type: object
            properties:
              params:
                description: params holds all the parameters of this module.
                type: object
            description: >-
              QueryParamsResponse is response type for the Query/Params RPC
              method.
        default:
          description: An unexpected error response.
          schema:
            type: object
            properties:
              error:
                type: string
              code:
                type: integer
                format: int32
              message:
                type: string
              details:
                type: array
                items:
                  type: object
                  properties:
                    type_url:
                      type: string
                    value:
                      type: string
                      format: byte
      tags:
        - Query
definitions:
  google.protobuf.Any:
    type: object
    properties:
      type_url:
        type: string
      value:
        type: string
        format: byte
  grpc.gateway.runtime.Error:
    type: object
    properties:
      error:
        type: string
      code:
        type: integer
        format: int32
      message:
        type: string
      details:
        type: array
        items:
          type: object
          properties:
            type_url:
              type: string
            value:
              type: string
              format: byte
  kujira.cwica.QueryInterchainAccountResponse:
    type: object
    properties:
      interchain_account_address:
        type: string
    title: >-
      QueryInterchainAccountResponse the response type for the
      Query/InterchainAccountAddress RPC
  cosmos.base.v1beta1.Coin:
    type: object
    properties:
      denom:
        type: string
      amount:
        type: string
    description: |-
      Coin defines a token with a denomination and an amount.

      NOTE: The amount field is an Int which implements the custom method
      signatures required by gogoproto.
  kujira.denom.DenomAuthorityMetadata:
    type: object
    properties:
      Admin:
        type: string
        title: 'Can be empty for no admin, or a valid kujira address'
    description: |-
      DenomAuthorityMetadata specifies metadata for addresses that have specific
      capabilities over a token factory denom. Right now there is only one Admin
      permission, but is planned to be extended to the future.
  kujira.denom.Params:
    type: object
    properties:
      creation_fee:
        type: array
        items:
          type: object
          properties:
            denom:
              type: string
            amount:
              type: string
          description: |-
            Coin defines a token with a denomination and an amount.

            NOTE: The amount field is an Int which implements the custom method
            signatures required by gogoproto.
    title: Params holds parameters for the denom module
  kujira.denom.QueryDenomAuthorityMetadataResponse:
    type: object
    properties:
      authority_metadata:
        type: object
        properties:
          Admin:
            type: string
            title: 'Can be empty for no admin, or a valid kujira address'
        description: >-
          DenomAuthorityMetadata specifies metadata for addresses that have
          specific

          capabilities over a token factory denom. Right now there is only one
          Admin

          permission, but is planned to be extended to the future.
  kujira.denom.QueryDenomsFromCreatorResponse:
    type: object
    properties:
      denoms:
        type: array
        items:
          type: string
  kujira.denom.QueryParamsResponse:
    type: object
    properties:
      params:
        description: params defines the parameters of the module.
        type: object
        properties:
          creation_fee:
            type: array
            items:
              type: object
              properties:
                denom:
                  type: string
                amount:
                  type: string
              description: >-
                Coin defines a token with a denomination and an amount.


                NOTE: The amount field is an Int which implements the custom
                method

                signatures required by gogoproto.
        title: Params holds parameters for the denom module
    description: QueryParamsResponse is the response type for the Query/Params RPC method.
  cosmos.base.v1beta1.DecCoin:
    type: object
    properties:
      denom:
        type: string
      amount:
        type: string
    description: |-
      DecCoin defines a token with a denomination and a decimal amount.

      NOTE: The amount field is an Dec which implements the custom method
      signatures required by gogoproto.
  kujira.oracle.Params:
    type: object
    properties:
      vote_period:
        type: string
        format: uint64
      vote_threshold:
        type: string
      max_deviation:
        type: string
      required_symbols:
        type: array
        items:
          type: object
          properties:
            symbol:
              type: string
            id:
              type: integer
              format: int64
          title: Symbol - the object to hold configurations of each symbol
      last_symbol_id:
        type: integer
        format: int64
      slash_fraction:
        type: string
      slash_window:
        type: string
        format: uint64
      min_valid_per_window:
        type: string
    description: Params defines the parameters for the oracle module.
  kujira.oracle.QueryActivesResponse:
    type: object
    properties:
      actives:
        type: array
        items:
          type: string
        description: >-
          actives defines a list of the symbols which oracle prices aggreed
          upon.
    description: |-
      QueryActivesResponse is response type for the
      Query/Actives RPC method.
  kujira.oracle.QueryExchangeRateResponse:
    type: object
    properties:
      exchange_rate:
        type: string
        title: exchange_rate defines the exchange rate of whitelisted assets
    description: |-
      QueryExchangeRateResponse is response type for the
      Query/ExchangeRate RPC method.
  kujira.oracle.QueryExchangeRatesResponse:
    type: object
    properties:
      exchange_rates:
        type: array
        items:
          type: object
          properties:
            denom:
              type: string
            amount:
              type: string
          description: |-
            DecCoin defines a token with a denomination and a decimal amount.

            NOTE: The amount field is an Dec which implements the custom method
            signatures required by gogoproto.
        description: >-
          exchange_rates defines a list of the exchange rate for all whitelisted
          symbols.
    description: |-
      QueryExchangeRatesResponse is response type for the
      Query/ExchangeRates RPC method.
  kujira.oracle.QueryMissCounterResponse:
    type: object
    properties:
      miss_counter:
        type: string
        format: uint64
        title: miss_counter defines the oracle miss counter of a validator
    description: |-
      QueryMissCounterResponse is response type for the
      Query/MissCounter RPC method.
  kujira.oracle.QueryParamsResponse:
    type: object
    properties:
      params:
        description: params defines the parameters of the module.
        type: object
        properties:
          vote_period:
            type: string
            format: uint64
          vote_threshold:
            type: string
          max_deviation:
            type: string
          required_symbols:
            type: array
            items:
              type: object
              properties:
                symbol:
                  type: string
                id:
                  type: integer
                  format: int64
              title: Symbol - the object to hold configurations of each symbol
          last_symbol_id:
            type: integer
            format: int64
          slash_fraction:
            type: string
          slash_window:
            type: string
            format: uint64
          min_valid_per_window:
            type: string
    description: QueryParamsResponse is the response type for the Query/Params RPC method.
  kujira.oracle.Symbol:
    type: object
    properties:
      symbol:
        type: string
      id:
        type: integer
        format: int64
    title: Symbol - the object to hold configurations of each symbol
  cosmos.base.query.v1beta1.PageRequest:
    type: object
    properties:
      key:
        type: string
        format: byte
        description: |-
          key is a value returned in PageResponse.next_key to begin
          querying the next page most efficiently. Only one of offset or key
          should be set.
      offset:
        type: string
        format: uint64
        description: |-
          offset is a numeric offset that can be used when key is unavailable.
          It is less efficient than using key. Only one of offset or key should
          be set.
      limit:
        type: string
        format: uint64
        description: >-
          limit is the total number of results to be returned in the result
          page.

          If left empty it will default to a value to be set by each app.
      count_total:
        type: boolean
        description: >-
          count_total is set to true  to indicate that the result set should
          include

          a count of the total number of items available for pagination in UIs.

          count_total is only respected when offset is used. It is ignored when
          key

          is set.
      reverse:
        type: boolean
        description: >-
          reverse is set to true if results are to be returned in the descending
          order.


          Since: cosmos-sdk 0.43
    description: |-
      message SomeRequest {
               Foo some_parameter = 1;
               PageRequest pagination = 2;
       }
    title: |-
      PageRequest is to be embedded in gRPC request messages for efficient
      pagination. Ex:
  cosmos.base.query.v1beta1.PageResponse:
    type: object
    properties:
      next_key:
        type: string
        format: byte
        description: |-
          next_key is the key to be passed to PageRequest.key to
          query the next page most efficiently. It will be empty if
          there are no more results.
      total:
        type: string
        format: uint64
        title: |-
          total is total number of results available if PageRequest.count_total
          was set, its value is undefined otherwise
    description: |-
      PageResponse is to be embedded in gRPC response messages where the
      corresponding request message has used PageRequest.

       message SomeResponse {
               repeated Bar results = 1;
               PageResponse page = 2;
       }
  kujira.scheduler.Hook:
    type: object
    properties:
      id:
        type: string
        format: uint64
      executor:
        type: string
      contract:
        type: string
      msg:
        type: string
        format: byte
      frequency:
        type: string
        format: int64
      funds:
        type: array
        items:
          type: object
          properties:
            denom:
              type: string
            amount:
              type: string
          description: |-
            Coin defines a token with a denomination and an amount.

            NOTE: The amount field is an Int which implements the custom method
            signatures required by gogoproto.
  kujira.scheduler.Params:
    type: object
    description: Params defines the parameters for the module.
  kujira.scheduler.QueryAllHookResponse:
    type: object
    properties:
      Hook:
        type: array
        items:
          type: object
          properties:
            id:
              type: string
              format: uint64
            executor:
              type: string
            contract:
              type: string
            msg:
              type: string
              format: byte
